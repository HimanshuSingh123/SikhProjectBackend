services:
  postgres:
    image: postgres:16
    container_name: sikhproject-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
